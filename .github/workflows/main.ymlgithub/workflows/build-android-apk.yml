name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install npm dependencies
        run: npm ci

      - name: Build web assets
        run: npm run react-build

      - name: Setup Java (JDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK (API 33)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          build-tools: '33.0.2'

      - name: Copy web assets to Android (Capacitor)
        run: |
          npx cap sync android || npx cap copy android

      - name: Build Android release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Collect APKs
        run: |
          ls -la android/app/build/outputs/apk || true

      - name: Optionally sign APK if keystore provided
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_TOOLS_VERSION: '33.0.2'
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -e
          APK_DIR=android/app/build/outputs/apk/release
          # find apk
          APK_FILE=$(ls $APK_DIR/*.apk 2>/dev/null | head -n1 || true)
          if [ -z "$APK_FILE" ]; then
            echo "No APK found to sign"
            exit 0
          fi
          echo "Found APK: $APK_FILE"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "Signing with apksigner..."
            APKSIGNER=$(find $ANDROID_HOME -type f -path "*/build-tools/*/apksigner" | head -n1 || true)
            if [ -z "$APKSIGNER" ]; then
              echo "apksigner not found in Android SDK build-tools. Listing build-tools:"
              ls $ANDROID_HOME/build-tools || true
              exit 1
            fi
            SIGNED_APK=${APK_FILE%.apk}-signed.apk
            $APKSIGNER sign --ks release.keystore --ks-pass pass:$KEYSTORE_PASSWORD --key-pass pass:$KEY_PASSWORD --out $SIGNED_APK $APK_FILE
            echo "Signed APK: $SIGNED_APK"
            echo "$SIGNED_APK" > signed-apk-path.txt
          else
            echo "No keystore provided; skipping signing step."
          fi

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload signed APK artifact (if created)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: signed-apk
          path: |
            $(if [ -f signed-apk-path.txt ]; then cat signed-apk-path.txt; else echo ""; fi)
